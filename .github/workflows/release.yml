name: Release (manual)

# Manual only. On launch, builds every artifact for BOTH supported stock-LLVM
# majors (22 and 23) and attaches them to a single DRAFT release:
#   * build22 / build23 — reusable build.yml, once per LLVM major. Each produces
#                         the full toolchain (Linux + Windows) and the loadable
#                         plugins (Linux .so + macOS arm64 .dylib) for that major.
#   * release           — gathers all artifacts from both build passes and drafts
#                         one release for manual review.
# All jobs share a single workflow run, so the release job downloads the build
# artifacts directly (no cross-run hand-off).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
      llvm22_ref:
        description: 'Stock LLVM 22 branch or tag to build against'
        required: true
        default: 'release/22.x'
      llvm23_ref:
        description: 'Stock LLVM 23 branch or tag to build against'
        required: true
        default: 'release/23.x'

jobs:
  build22:
    uses: ./.github/workflows/build.yml
    with:
      llvm_major: '22'
      llvm_ref: ${{ inputs.llvm22_ref }}

  build23:
    uses: ./.github/workflows/build.yml
    with:
      llvm_major: '23'
      llvm_ref: ${{ inputs.llvm23_ref }}

  # ==========================================================================
  # Draft release with all artifacts from both LLVM builds (manual review).
  # ==========================================================================
  release:
    name: Draft release
    needs: [build22, build23]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Create DRAFT release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: artifacts/*
          draft: true
          prerelease: ${{ contains(inputs.tag, '-rc') || contains(inputs.tag, '-beta') }}
          body: |
            ## xollvm — ${{ inputs.tag }}

            Built against stock LLVM `${{ inputs.llvm22_ref }}` (LLVM 22) and
            `${{ inputs.llvm23_ref }}` (LLVM 23). Pick the artifact matching the
            LLVM version you deploy against.

            ### Artifacts
            | File | What | OS | LLVM |
            |---|---|---|---|
            | `xollvm-linux-llvm22-Release.tar.zst` | clang/opt with obfuscator built in | Linux x86_64 | 22 |
            | `xollvm-windows-llvm22-Release.7z` | clang/opt with obfuscator built in | Windows x64 | 22 |
            | `xollvm-linux-llvm23-Release.tar.zst` | clang/opt with obfuscator built in | Linux x86_64 | 23 |
            | `xollvm-windows-llvm23-Release.7z` | clang/opt with obfuscator built in | Windows x64 | 23 |
            | `Obfuscator-linux-x64-llvm22.so` | loadable `-fpass-plugin` | Linux x86_64 | 22 |
            | `Obfuscator-linux-x64-llvm23.so` | loadable `-fpass-plugin` | Linux x86_64 | 23 |
            | `Obfuscator-macos-arm64-llvm22.dylib` | loadable `-fpass-plugin` | macOS arm64 | 22 |
            | `Obfuscator-macos-arm64-llvm23.dylib` | loadable `-fpass-plugin` | macOS arm64 | 23 |

            ### Cross-compilation backends
            `-DLLVM_TARGETS_TO_BUILD="X86;AArch64;ARM;RISCV"` — X86, AArch64, ARM, RISC-V.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
